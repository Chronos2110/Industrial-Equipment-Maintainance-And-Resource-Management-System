<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IEMRS - Industrial Equipment Maintenance & Resource Management System</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-container">

            <div class="login-header">
                <span class="system-badge">Enterprise Control System</span>
                <h1>IEMRS</h1>
                <p>Industrial Equipment Maintenance and Resource Management System</p>
                <div class="sdg-badges">
                    <span class="sdg-tag">SDG 8: Decent Work</span>
                    <span class="sdg-tag">SDG 9: Industry & Innovation</span>
                    <span class="sdg-tag">SDG 12: Responsible Consumption</span>
                </div>
            </div>

            <div class="login-box">

                <h2>System Authentication</h2>

                <form id="loginForm">

                    <div class="mb-3">
                        <label for="username" class="form-label">Operator / User ID</label>
                        <input type="text" id="username" class="form-control" placeholder="Enter username (e.g. admin)">
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Security Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Enter password">
                    </div>

                    <div class="mb-4">
                        <label for="role" class="form-label">Authorized Role</label>
                        <select id="role" class="form-select">
                            <option value="">Select Operational Role</option>
                            <option value="Administrator">Administrator</option>
                            <option value="Technician">Technician</option>
                            <option value="Operator">Operator</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">
                        Authorize & Login
                    </button>

                    <p id="loginMessage"></p>

                </form>

            </div>

        </div>

    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Login Logic -->
    <script src="js/app.js"></script>

</body>

</html>
