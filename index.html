<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FORGE - Industrial Equipment Maintenance & Resource Management</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="login-page">

        <div class="login-container">

            <div class="login-split-card">

                <!-- Left Panel: FORGE Wordmark + Subtitle Only -->
                <div class="login-brand-panel">
                    <h1>FORGE</h1>
                    <p>Industrial Equipment Maintenance & Resource Management</p>
                </div>

                <!-- Right Panel: Login Form Only -->
                <div class="login-form-panel">

                    <form id="loginForm">

                        <div class="mb-3">
                            <label for="username" class="form-label">Username</label>
                            <input type="text" id="username" class="form-control" placeholder="Enter username (e.g. admin)" required>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label">Password</label>
                            <input type="password" id="password" class="form-control" placeholder="Enter password" required>
                        </div>

                        <div class="mb-4">
                            <label for="role" class="form-label">Role</label>
                            <select id="role" class="form-select" required>
                                <option value="">Select Role</option>
                                <option value="Administrator">Administrator</option>
                                <option value="Technician">Technician</option>
                                <option value="Operator">Operator</option>
                            </select>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2">
                            Sign In
                        </button>

                        <p id="loginMessage"></p>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Login Logic -->
    <script src="js/app.js"></script>

</body>

</html>
